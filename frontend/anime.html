<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anime Hub</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <h1>Anime Hub</h1>

    <input id="anime-input" type="text" placeholder="Enter Anime Name">

    <button id="search-button">Search</button>


    <div id="anime-container"></div>
    <a href="https://www.pinterest.com/">Printest</a>
    
    <select id="sort-select">
        <option value="default">Sort by Option</option>
        <option value="ratingHigh">Rating High-Low</option>
        <option value="ratingLow">Rating Low-High</option>
        <option value="name">Name A-Z</option>
    </select>

    <script src="/static/js/anime.js"></script>

</body>
</html>
